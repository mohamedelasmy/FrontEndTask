<div class="tree-table-card">
  <table class="tree-table">
    <thead>
      <tr>
        <th>Name (English)</th>
        <th>Name (Arabic)</th>
        <th>ID</th>
      </tr>
    </thead>
    <tbody>
      @for (row of pagedRows; track row.id) {
        <tr>
          <td>
            <div class="tree-cell" [style.padding-left.px]="(row.level || 0) * 24">
              @if (hasChildren(row)) {
                <button class="toggle-btn" (click)="toggleNode(row)">
                  <span class="toggle-icon" [class.expanded]="row.expanded">▶</span>
                </button>
              } @else {
                <span class="no-toggle"></span>
              }
              {{ row.name }}
            </div>
          </td>
          <td>{{ row.nameAr }}</td>
          <td>{{ row.id }}</td>
        </tr>
      }
    </tbody>
  </table>

  <!-- Pagination -->
  <div class="pagination-container">
    <div class="pagination-info">
      Showing {{ startItem }} to {{ endItem }} of {{ visibleRows.length }} entries
    </div>

    <div class="pagination-controls">
      <div class="rows-per-page">
        <label>Rows per page:</label>
        <select [value]="pageSize" (change)="changePageSize(+$any($event.target).value)">
          @for (option of pageSizeOptions; track option) {
            <option [value]="option">{{ option }}</option>
          }
        </select>
      </div>

      <div class="pagination-buttons">
        <button (click)="previousPage()" [disabled]="currentPage === 1">
          Previous
        </button>
        <span class="page-numbers">
          Page {{ currentPage }} of {{ totalPages }}
        </span>
        <button (click)="nextPage()" [disabled]="currentPage === totalPages">
          Next
        </button>
      </div>
    </div>
  </div>
</div>
